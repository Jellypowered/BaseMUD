services:
  app:
    image: basemud:latest
    build:
      context: .
    volumes:
      - ./log:/opt/rom/log:rw
      - ./player:/opt/rom/player:rw
      - ./gods:/opt/rom/gods:rw
      - ./json/areas:/opt/rom/json/areas:rw
      - ./json/config:/opt/rom/json/config:rw
      - ./json/help:/opt/rom/json/help:rw
      - ./json/temp:/opt/rom/json/temp:rw
    ports:
      - "4000:4000"
